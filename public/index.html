<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Tribal Vend</title>
<style>
  :root{
    color-scheme: light;
    --plane:#f5f4f0; --surface:#ffffff; --surface-2:#eeece6;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#8a8880;
    --grid:#e6e4dd; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0a8f0a; --bad:#cc2f2f; --warn:#b8860b;
    --accent:#2a78d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(104px + env(safe-area-inset-bottom));
  }
  header{
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    display:flex; align-items:baseline; gap:10px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--plane); z-index:5;
  }
  header .logo{font-weight:800; letter-spacing:-.02em; font-size:19px}
  header .sub{color:var(--muted); font-size:12px}
  main{padding:16px 14px 40px; max-width:760px; margin:0 auto}
  /* P&L table + richer stat components */
  .tbl{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums}
  .tbl th{text-align:right; color:var(--muted); font-weight:700; padding:7px 6px; border-bottom:1px solid var(--grid); white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.04em}
  .tbl th:first-child, .tbl td:first-child{text-align:left}
  .tbl td{text-align:right; padding:8px 6px; border-bottom:1px solid var(--grid); white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl .pos{color:var(--good); font-weight:700}
  .tbl .neg{color:var(--bad); font-weight:700}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px}
  .hero{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 16px 14px}
  .hero .k{color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  .hero .v{font-size:38px; font-weight:800; letter-spacing:-.03em; margin:4px 0 2px; line-height:1}
  .hero .sub{color:var(--ink-2); font-size:13px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .chip{background:var(--surface-2); border-radius:10px; padding:8px 10px; font-size:12px; font-weight:600; color:var(--ink-2)}
  .chip b{display:block; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums}
  .bar-line{display:flex; align-items:center; gap:8px; padding:7px 4px}
  .bar-line .lbl{flex:0 0 92px; font-size:12px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar-line .track{flex:1; height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-line .fill{height:100%; border-radius:99px}
  .bar-line .amt{flex:0 0 auto; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; min-width:52px; text-align:right}
  .alert{border-left:3px solid var(--bad); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--ink-2); line-height:1.5; margin-top:10px}
  .alert b{color:var(--ink)}
  .seg{display:flex; gap:6px; margin:2px 2px 10px}
  .seg button{flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); font-weight:700; font-size:12px; cursor:pointer}
  .seg button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  section[hidden]{display:none}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:26px 4px 10px; font-weight:700}
  h2:first-child{margin-top:6px}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 15px}
  .tile .k{color:var(--muted); font-size:12px; font-weight:600}
  .tile .v{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:3px}
  .tile .d{font-size:12px; margin-top:2px; font-weight:600}
  .up{color:var(--good)} .down{color:var(--bad)}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 14px 12px}
  .card + .card{margin-top:12px}
  .card .ct{font-weight:700; font-size:15px; margin:0 2px 2px}
  .card .cs{color:var(--muted); font-size:12px; margin:0 2px 12px}
  svg.chart{display:block; width:100%; height:auto; overflow:visible}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin:10px 2px 2px}
  .legend span{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block}

  .rows{margin-top:4px}
  .row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--grid)}
  .row:first-child{border-top:0}
  .row .nm{flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .mt{font-size:12px; color:var(--muted)}
  .row .val{font-weight:700; font-variant-numeric:tabular-nums; font-size:14px}

  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:0; color:var(--muted);
    padding:11px 4px 12px; font-size:11px; font-weight:700; letter-spacing:.02em;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  nav button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8}
  nav button.on{color:var(--accent)}

  .field{margin:14px 0}
  .field label{display:block; font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:7px}
  select,input[type=text]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:16px; font-family:inherit;
  }
  .parlist{margin-top:6px}
  .par{display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--grid)}
  .par .sl{width:44px; font-weight:700; color:var(--muted); font-size:13px}
  .par .pi{flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .par input{width:66px; text-align:center; padding:9px 6px; font-size:16px}
  .btn{
    display:block; width:100%; margin-top:18px; background:var(--accent); color:#fff;
    border:0; border-radius:14px; padding:16px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .btn.ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--border)}
  .note{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
        border-radius:12px; padding:12px 14px; font-size:13px; color:var(--ink-2); line-height:1.5; margin-top:14px}
  .buy .row .val{color:var(--good)}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:26px 10px}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px}
  .pill.bad{background:rgba(204,47,47,.12); color:#b02a2a}
  .pill.warn{background:rgba(184,134,11,.16); color:#8a6d0a}

  /* passcode lock — first paint, covers everything */
  #lock{position:fixed; inset:0; z-index:200; background:var(--plane); display:flex; align-items:center; justify-content:center; padding:24px}
  #lock .lk-box{width:100%; max-width:320px; text-align:center}
  #lock .lk-logo{font-size:22px; font-weight:800; letter-spacing:-.02em}
  #lock .lk-sub{color:var(--muted); font-size:13px; margin:6px 0 16px}
  #lock input{width:100%; background:var(--surface); border:1px solid var(--border); color:var(--ink); border-radius:12px; padding:14px; font-size:18px; text-align:center}
  #lock #pcerr{color:var(--bad); font-size:12px; height:16px; margin-top:8px}
  #lock button{width:100%; margin-top:6px; background:var(--accent); color:#fff; border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:800; cursor:pointer}
</style>
</head>
<body>

<div id="lock">
  <div class="lk-box">
    <div class="lk-logo">Tribal Vend</div>
    <div id="lk-wait" class="lk-sub">Unlocking…</div>
    <div id="lockform" style="display:none">
      <div class="lk-sub">Enter your passcode</div>
      <input id="pc" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
      <div id="pcerr"></div>
      <button id="pcgo">Unlock</button>
    </div>
  </div>
</div>

<header>
  <span class="logo">Tribal Vend</span>
  <span class="sub">2 machines · State College</span>
</header>

<main>
  <section id="company"></section>
  <section id="runs" hidden></section>
  <section id="closet" hidden></section>
</main>

<nav>
  <button data-tab="company" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Company
  </button>
  <button data-tab="runs">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/><circle cx="19" cy="18" r="2"/></svg>
    Runs
  </button>
  <button data-tab="closet">
    <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM4 7l2-3h12l2 3M10 11h4"/></svg>
    Closet
  </button>
</nav>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }

  // Safety net: if the app fails to start for any reason, show a real message
  // with a one-tap repair instead of a silent white screen.
  function tvFail(detail){
    if (document.getElementById("tv-fail")) return;
    var d = document.createElement("div");
    d.id = "tv-fail";
    d.style.cssText = "position:fixed;inset:0;z-index:999;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif";
    d.innerHTML =
      '<div style="max-width:340px;text-align:center">' +
      '<div style="font-size:19px;font-weight:800;margin-bottom:6px">Tribal Vend needs a refresh</div>' +
      '<div style="color:#555;font-size:13px;line-height:1.5;margin-bottom:16px">The app got a stale copy of itself. Tap below to clear it and reload — nothing is lost.</div>' +
      '<button id="tv-fix" style="width:100%;background:#1f6feb;color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800">Repair &amp; reload</button>' +
      '<div style="color:#999;font-size:11px;margin-top:14px;word-break:break-word">' + (detail || "") + '</div>' +
      '</div>';
    document.body.appendChild(d);
    document.getElementById("tv-fix").onclick = async function(){
      try {
        if (window.caches) { var ks = await caches.keys(); await Promise.all(ks.map(function(k){ return caches.delete(k); })); }
        if (navigator.serviceWorker) { var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){ return r.unregister(); })); }
      } catch(e){}
      location.reload(true);
    };
  }
  window.addEventListener("error", function(e){
    if (e && e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) tvFail("Couldn't load " + (e.target.src || e.target.href || "a file"));
    else if (e && e.message) tvFail(e.message);
  }, true);
  window.addEventListener("unhandledrejection", function(e){ tvFail(e && e.reason ? String(e.reason).slice(0,140) : "Startup failed"); });
  // If nothing has rendered after 8s, treat it as a failed start.
  window.addEventListener("load", function(){
    setTimeout(function(){
      var c = document.getElementById("company");
      var painted = (c && c.innerHTML.trim().length > 0) || document.getElementById("pc") || document.getElementById("tv-fail");
      if (!painted) tvFail("The app didn't finish starting.");
    }, 8000);
  });
</script>
</body>
</html>
