# Keeps the Render free-tier service awake during working hours so the app opens
# instantly instead of showing Render's 30–60s wake screen.
#
# Render sleeps after ~15 minutes idle, so this pings just under that.
# Weekdays only, 6am–9pm Eastern — the machines are in a workplace and sales are
# effectively zero on weekends, so there's nothing to keep awake for.

name: Keep app awake

on:
  schedule:
    # Every 14 minutes, 10:00–23:59 and 00:00–01:59 UTC = 6am–9:59pm Eastern (EDT).
    - cron: "*/14 10-23,0-1 * * 1-5"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://tribalvend.com/api/health || echo "000")
          echo "tribalvend.com/api/health -> HTTP $code"
          # A wake can take a while; treat any response as success so the job
          # doesn't spam failure emails.
          exit 0
